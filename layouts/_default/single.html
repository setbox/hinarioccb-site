{{ define "main" -}}
  <h1 class="title {{ if .Params.ocasioes }}mb-2{{ else }}mb-5{{ end }}">{{ .Params.numero }} - {{ .Title }}</h1>

  {{ with .Params.ocasioes }}
    <p class="text-center mb-5">
      {{ range . }}<span class="badge bg-secondary me-1">{{ . }}</span>{{ end }}
    </p>
  {{ end }}

  {{ .Content }}

  <div class="my-5">
    <a href="{{ "/" | relURL }}" class="btn btn-primary">Voltar</a>
  </div>
{{- end }}
