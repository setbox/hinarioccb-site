<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ if (isset .Params "numero") }}
  <title>{{ .Title }} ({{ .Params.numero }}) - HinárioCCB.net</title>
{{ else }}
  <title>HinárioCCB.net</title>
{{ end }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
var consentimento = null;
try { consentimento = localStorage.getItem('consentimento'); } catch (e) {}
var estado = consentimento === 'aceito' ? 'granted' : 'denied';
gtag('consent', 'default', {
  ad_storage: estado,
  ad_user_data: estado,
  ad_personalization: estado,
  analytics_storage: estado
});
gtag('js', new Date());
gtag('config', 'G-R3VKLGHS2N');
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R3VKLGHS2N"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6135599490918760"
     crossorigin="anonymous"></script>
</head>
  <style>
    h1 {
      text-align: center;
    }
    .nav-link:hover {
      background-color: #e9ecef;
    }
  </style>
<body>

<div class="container mt-5">
  {{ block "main" . -}}{{- end }}
</div>

<div id="aviso-cookies" class="position-fixed bottom-0 start-0 end-0 bg-light border-top p-3 d-none">
  <div class="container d-flex flex-column flex-md-row align-items-md-center gap-2">
    <p class="mb-0 flex-grow-1">Usamos cookies do Google Analytics e do Google AdSense para medir o acesso e exibir anúncios. Você pode aceitar ou recusar.</p>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-outline-secondary" data-consentimento="recusado">Recusar</button>
      <button type="button" class="btn btn-primary" data-consentimento="aceito">Aceitar</button>
    </div>
  </div>
</div>
<script>
(function () {
  var aviso = document.getElementById('aviso-cookies');
  if (consentimento) return;
  aviso.classList.remove('d-none');
  aviso.querySelectorAll('[data-consentimento]').forEach(function (botao) {
    botao.addEventListener('click', function () {
      var escolha = botao.getAttribute('data-consentimento');
      try { localStorage.setItem('consentimento', escolha); } catch (e) {}
      if (escolha === 'aceito') {
        gtag('consent', 'update', {
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted',
          analytics_storage: 'granted'
        });
      }
      aviso.classList.add('d-none');
    });
  });
})();
</script>

</body>
</html>
