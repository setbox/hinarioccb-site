{{ define "titulo" }}Página não encontrada | HinárioCCB.net{{ end }}
{{ define "indexacao" }}<meta name="robots" content="noindex">{{ end }}

{{ define "main" }}
<div class="pagina">
  <main class="conteudo conteudo-largo nao-encontrada" id="conteudo">
    <p class="hino-numero">404</p>
    <h1>Página não encontrada</h1>
    {{ partial "ornamento.html" . }}
    <p>Digite o número do hino:</p>
    {{ partial "numero.html" (dict "id" "numero-404") }}
    <p><a href="{{ "/" | relURL }}">Voltar para o índice</a></p>
  </main>
</div>
{{ end }}
