baseURL = "https://hinarioccb.net/"
languageCode = "pt-BR"
title = "HinárioCCB.net"

DefaultContentLanguage = "pt-br"
enableInlineShortcodes = true
summarylength = 10
enableEmoji = true
removePathAccents = true
titleCaseStyle = "none"
ignoreErrors = ["error-remote-getjson"]
enableRobotsTXT = true
enableGitInfo = true

[taxonomies]
ocasiao = "ocasioes"

[permalinks.page]
cifras = "/5/:contentbasename/cifra/"
partituras = "/5/:contentbasename/partitura/"

[pagination]
pagerSize = 5

[markup.goldmark.renderer]
hardWraps = true

[params]
contato = "contato@setbox.com.br"
relatorio = "https://relatorioccb.net/ccb-perto-de-mim"
relatorio_site = "https://relatorioccb.net"
